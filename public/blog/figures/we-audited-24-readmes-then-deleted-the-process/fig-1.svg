<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="fig1Title">
<title id="fig1Title">Line chart: compliance rises after each manual cleanup then decays before the next one, sawtoothing over time. Once the required CI check lands, compliance stays flat at the top instead of decaying again.</title>
<g font-family="SFMono-Regular, ui-monospace, Cascadia Mono, Consolas, monospace">
  <rect x="0.5" y="0.5" width="759" height="359" rx="12" fill="#002438" stroke="#12455e" stroke-width="1"/>

  <rect x="60" y="20" width="18" height="6" rx="2" fill="#1e9be2"/>
  <text x="84" y="26" font-size="13" fill="#ffffff" dominant-baseline="central">manual cleanup</text>
  <rect x="231" y="20" width="18" height="6" rx="2" fill="#ff0092"/>
  <text x="255" y="26" font-size="13" fill="#ffffff" dominant-baseline="central">required CI check</text>

  <line x1="52" y1="72" x2="52" y2="312" stroke="#12455e" stroke-width="1"/>
  <line x1="52" y1="312" x2="732" y2="312" stroke="#12455e" stroke-width="1"/>
  <text x="60" y="64" fill="#6d92a8" font-size="12">compliance</text>
  <text x="732" y="334" fill="#6d92a8" font-size="12" text-anchor="end">time</text>

  <polyline points="52,276 92,278 106,130 296,252 312,254 326,134 462,256" fill="none" stroke="#1e9be2" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="120" y="118" fill="#ffffff" font-size="13">cleanup, decay, cleanup again</text>

  <line x1="466" y1="72" x2="466" y2="312" stroke="#ff5c8a" stroke-width="1.5" stroke-dasharray="4 5"/>
  <text x="474" y="300" fill="#ff5c8a" font-size="12">gate lands</text>

  <polyline points="466,128 732,124" fill="none" stroke="#ff0092" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="732" cy="124" r="5" fill="#ff0092" stroke="#002438" stroke-width="2"/>
  <text x="560" y="106" fill="#ffffff" font-size="13">a property, not a project</text>
</g>
</svg>
