<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 730" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" role="img" aria-label="Diagram: Claude Code hooks and the terminal title fallback both feed a merge step with explicit precedence, which drives the session card status">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d84a8b" />
    </marker>
    <marker id="arrowFaint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b8697" />
    </marker>
  </defs>

  <rect x="1" y="1" width="498" height="728" rx="10" fill="#002438" stroke="#e07a9f" stroke-opacity="0.18" />

  <text x="28" y="42" font-size="16" fill="#6b8697">$ <tspan fill="#d84a8b">cat</tspan> <tspan fill="#ffffff">status-detection.md</tspan></text>

  <!-- hooks source -->
  <rect x="32" y="70" width="436" height="150" rx="6" fill="#06304a" stroke="#d84a8b" stroke-opacity="0.55" />
  <text x="52" y="102" font-size="17" font-weight="700" fill="#ffffff">Claude Code hooks</text>
  <text x="52" y="126" font-size="12" fill="#d84a8b" letter-spacing="1">AUTHORITATIVE</text>
  <text x="52" y="154" font-size="14.5" fill="#9fb6c4">Stop / UserPromptSubmit</text>
  <text x="52" y="178" font-size="14.5" fill="#9fb6c4">SessionStart / SessionEnd</text>
  <text x="52" y="202" font-size="14.5" fill="#9fb6c4">SubagentStart / SubagentStop</text>

  <!-- title source -->
  <rect x="32" y="252" width="436" height="150" rx="6" fill="#06304a" stroke="#6b8697" stroke-opacity="0.5" stroke-dasharray="5 4" />
  <text x="52" y="284" font-size="17" font-weight="700" fill="#ffffff">Terminal title (OSC 0)</text>
  <text x="52" y="308" font-size="12" fill="#9fb6c4" letter-spacing="1">FALLBACK</text>
  <text x="52" y="336" font-size="14.5" fill="#9fb6c4">spinner &#8594; working</text>
  <text x="52" y="360" font-size="14.5" fill="#9fb6c4">idle glyph &#8594; ready</text>
  <text x="52" y="384" font-size="14.5" fill="#9fb6c4">anything else &#8594; unknown</text>

  <!-- merge -->
  <rect x="32" y="452" width="436" height="120" rx="6" fill="#06304a" stroke="#e07a9f" stroke-opacity="0.35" />
  <text x="52" y="484" font-size="17" font-weight="700" fill="#ffffff">Merge</text>
  <text x="52" y="512" font-size="14.5" fill="#9fb6c4">hook beats title</text>
  <text x="52" y="534" font-size="14.5" fill="#9fb6c4">ready is held briefly: a racing</text>
  <text x="52" y="556" font-size="14.5" fill="#9fb6c4">awaiting-input or working wins</text>

  <!-- status -->
  <rect x="32" y="606" width="436" height="88" rx="6" fill="#06304a" stroke="#e07a9f" stroke-opacity="0.35" />
  <text x="52" y="638" font-size="17" font-weight="700" fill="#ffffff">Card status</text>
  <text x="52" y="666" font-size="14.5" fill="#9fb6c4">working / awaiting input</text>
  <text x="52" y="686" font-size="14.5" fill="#d84a8b">task complete</text>

  <!-- hooks route down the right margin into the merge box -->
  <path d="M468,145 C486,145 486,145 486,240 L486,512 C486,512 486,512 472,512" fill="none" stroke="#d84a8b" stroke-width="2" marker-end="url(#arrow)" />
  <!-- title straight down into the merge box -->
  <path d="M250,402 L250,448" fill="none" stroke="#6b8697" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowFaint)" />
  <path d="M250,572 L250,602" fill="none" stroke="#d84a8b" stroke-width="2" marker-end="url(#arrow)" />
</svg>
