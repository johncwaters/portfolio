<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" role="img" aria-label="Diagram: Claude Code hooks and the terminal title fallback both feed a merge step with explicit precedence, which drives the session card status">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d84a8b" />
    </marker>
    <marker id="arrowFaint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b8697" />
    </marker>
  </defs>

  <rect x="1" y="1" width="858" height="418" rx="10" fill="#002438" stroke="#e07a9f" stroke-opacity="0.18" />

  <text x="28" y="42" font-size="15" fill="#6b8697">$ <tspan fill="#d84a8b">cat</tspan> <tspan fill="#ffffff">status-detection.md</tspan></text>

  <!-- hooks source -->
  <rect x="28" y="72" width="264" height="140" rx="6" fill="#06304a" stroke="#d84a8b" stroke-opacity="0.55" />
  <text x="44" y="100" font-size="14" font-weight="700" fill="#ffffff">Claude Code hooks</text>
  <text x="44" y="122" font-size="11" fill="#d84a8b" letter-spacing="1">AUTHORITATIVE</text>
  <text x="44" y="148" font-size="12" fill="#9fb6c4">Stop / UserPromptSubmit</text>
  <text x="44" y="168" font-size="12" fill="#9fb6c4">SessionStart / SessionEnd</text>
  <text x="44" y="188" font-size="12" fill="#9fb6c4">SubagentStart / SubagentStop</text>

  <!-- title source -->
  <rect x="28" y="248" width="264" height="140" rx="6" fill="#06304a" stroke="#6b8697" stroke-opacity="0.5" stroke-dasharray="5 4" />
  <text x="44" y="276" font-size="14" font-weight="700" fill="#ffffff">Terminal title (OSC 0)</text>
  <text x="44" y="298" font-size="11" fill="#9fb6c4" letter-spacing="1">FALLBACK</text>
  <text x="44" y="324" font-size="12" fill="#9fb6c4">spinner &#8594; working</text>
  <text x="44" y="344" font-size="12" fill="#9fb6c4">idle glyph &#8594; ready</text>
  <text x="44" y="364" font-size="12" fill="#9fb6c4">anything else &#8594; unknown</text>

  <!-- merge -->
  <rect x="380" y="152" width="240" height="156" rx="6" fill="#06304a" stroke="#e07a9f" stroke-opacity="0.35" />
  <text x="396" y="182" font-size="14" font-weight="700" fill="#ffffff">Merge</text>
  <text x="396" y="210" font-size="12" fill="#9fb6c4">hook beats title</text>
  <text x="396" y="234" font-size="12" fill="#9fb6c4">ready is held briefly:</text>
  <text x="396" y="254" font-size="12" fill="#9fb6c4">a racing awaiting-input</text>
  <text x="396" y="274" font-size="12" fill="#9fb6c4">or working wins instead</text>

  <!-- status -->
  <rect x="688" y="160" width="148" height="140" rx="6" fill="#06304a" stroke="#e07a9f" stroke-opacity="0.35" />
  <text x="704" y="190" font-size="14" font-weight="700" fill="#ffffff">Card status</text>
  <text x="704" y="220" font-size="12" fill="#9fb6c4">working</text>
  <text x="704" y="242" font-size="12" fill="#9fb6c4">awaiting input</text>
  <text x="704" y="264" font-size="12" fill="#d84a8b">task complete</text>

  <path d="M292,142 C340,142 340,198 380,198" fill="none" stroke="#d84a8b" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M292,318 C340,318 340,262 380,262" fill="none" stroke="#6b8697" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowFaint)" />
  <path d="M620,230 L688,230" fill="none" stroke="#d84a8b" stroke-width="2" marker-end="url(#arrow)" />
</svg>
