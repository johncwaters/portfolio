<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 800" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" role="img" aria-label="Diagram: the arbiter that decides whether a held ready signal is cancelled, kept holding, or released as task complete">
  <defs>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a2a4a" />
    </marker>
    <marker id="arrowD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9fb6c4" />
    </marker>
    <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d84a8b" />
    </marker>
  </defs>

  <rect x="1" y="1" width="498" height="798" rx="10" fill="#002438" stroke="#e07a9f" stroke-opacity="0.18" />

  <text x="28" y="42" font-size="16" fill="#6b8697">$ <tspan fill="#d84a8b">cat</tspan> <tspan fill="#ffffff">release-held-ready.md</tspan></text>

  <!-- entry -->
  <rect x="32" y="70" width="436" height="48" rx="6" fill="#06304a" stroke="#e07a9f" stroke-opacity="0.4" />
  <text x="250" y="100" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">held ready (from a real Stop)</text>

  <path d="M250,118 L250,146" fill="none" stroke="#9fb6c4" stroke-width="2" marker-end="url(#arrowD)" />

  <!-- check 1 -->
  <rect x="32" y="150" width="436" height="52" fill="#06304a" stroke="#6b8697" stroke-opacity="0.5" />
  <text x="250" y="182" font-size="15.5" fill="#9fb6c4" text-anchor="middle">state changed since the stash?</text>
  <path d="M388,202 L388,218" fill="none" stroke="#8a2a4a" stroke-width="2" marker-end="url(#arrowR)" />
  <rect x="250" y="222" width="218" height="42" rx="6" fill="#002438" stroke="#8a2a4a" />
  <text x="359" y="249" font-size="15" fill="#e07a9f" text-anchor="middle">yes: cancel</text>
  <path d="M140,202 L140,286" fill="none" stroke="#9fb6c4" stroke-width="2" marker-end="url(#arrowD)" />
  <text x="152" y="252" font-size="13" fill="#6b8697">no</text>

  <!-- check 2 -->
  <rect x="32" y="290" width="436" height="68" fill="#06304a" stroke="#6b8697" stroke-opacity="0.5" />
  <text x="250" y="318" font-size="15.5" fill="#9fb6c4" text-anchor="middle">newer signal after the stash?</text>
  <text x="250" y="342" font-size="12.5" fill="#6b8697" text-anchor="middle">(ordered by seq, not timestamp)</text>
  <path d="M388,358 L388,374" fill="none" stroke="#8a2a4a" stroke-width="2" marker-end="url(#arrowR)" />
  <rect x="250" y="378" width="218" height="42" rx="6" fill="#002438" stroke="#8a2a4a" />
  <text x="359" y="405" font-size="15" fill="#e07a9f" text-anchor="middle">yes: cancel</text>
  <path d="M140,358 L140,436" fill="none" stroke="#9fb6c4" stroke-width="2" marker-end="url(#arrowD)" />
  <text x="152" y="404" font-size="13" fill="#6b8697">no</text>

  <!-- check 3 -->
  <rect x="32" y="440" width="436" height="68" fill="#06304a" stroke="#6b8697" stroke-opacity="0.5" />
  <text x="250" y="468" font-size="15.5" fill="#9fb6c4" text-anchor="middle">anything still gating?</text>
  <text x="250" y="492" font-size="12.5" fill="#6b8697" text-anchor="middle">(sub-agents, declared tasks)</text>
  <path d="M388,508 L388,524" fill="none" stroke="#9fb6c4" stroke-width="2" marker-end="url(#arrowD)" />
  <rect x="250" y="528" width="218" height="42" rx="6" fill="#002438" stroke="#6b8697" />
  <text x="359" y="555" font-size="15" fill="#9fb6c4" text-anchor="middle">yes: keep holding</text>
  <path d="M140,508 L140,586" fill="none" stroke="#9fb6c4" stroke-width="2" marker-end="url(#arrowD)" />
  <text x="152" y="554" font-size="13" fill="#6b8697">no</text>

  <!-- check 4 -->
  <rect x="32" y="590" width="436" height="52" fill="#06304a" stroke="#6b8697" stroke-opacity="0.5" />
  <text x="250" y="622" font-size="15.5" fill="#9fb6c4" text-anchor="middle">quiet long enough? (10s)</text>
  <path d="M388,642 L388,658" fill="none" stroke="#9fb6c4" stroke-width="2" marker-end="url(#arrowD)" />
  <rect x="250" y="662" width="218" height="42" rx="6" fill="#002438" stroke="#6b8697" />
  <text x="359" y="689" font-size="15" fill="#9fb6c4" text-anchor="middle">no: keep holding</text>
  <path d="M140,642 L140,712" fill="none" stroke="#d84a8b" stroke-width="2" marker-end="url(#arrowP)" />
  <text x="152" y="686" font-size="13" fill="#d84a8b">yes</text>

  <!-- release -->
  <rect x="32" y="716" width="436" height="52" rx="6" fill="#06304a" stroke="#d84a8b" />
  <text x="250" y="748" font-size="16" font-weight="700" fill="#d84a8b" text-anchor="middle">release: task complete</text>
</svg>
