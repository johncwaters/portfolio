<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 894" width="2048" height="894" role="img" aria-label="Terminal window showing a large 403 authorization failed error, a code panel with a struck-through hand-edit fix replaced by a Bicep resource block, and a drift gate marker at the edge of the frame">
  <defs>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="2048" height="894" rx="24" ry="24"/>
    </clipPath>
    <linearGradient id="fourohthreeGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff0005"/>
      <stop offset="1" stop-color="#ff0092"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="2048" height="894" fill="#002438"/>

    <rect x="0" y="0" width="2048" height="68" fill="#032033"/>
    <line x1="0" y1="68" x2="2048" y2="68" stroke="#12455e" stroke-width="1"/>
    <circle cx="44" cy="34" r="11.3" fill="#ff0005"/>
    <circle cx="91" cy="34" r="11.3" fill="#ff0092"/>
    <circle cx="138" cy="34" r="11.3" fill="#12455e"/>
    <rect x="195" y="15.5" width="855" height="37" rx="18.5" fill="#001b2b" stroke="#12455e" stroke-width="1"/>
    <text x="223" y="39.5" font-family="SFMono-Regular, ui-monospace, Cascadia Mono, Consolas, monospace" font-size="27" fill="#6d92a8">blog/<tspan fill="#ff5c8a">the-403-that-refused-to-be-a-one-line-fix</tspan></text>

    <text x="62" y="552" font-family="SFMono-Regular, ui-monospace, Cascadia Mono, Consolas, monospace" font-size="307" font-weight="700" letter-spacing="-6" fill="url(#fourohthreeGradient)">403</text>
    <text x="63" y="602" font-family="SFMono-Regular, ui-monospace, Cascadia Mono, Consolas, monospace" font-size="30" letter-spacing="6.8" fill="#6d92a8">AUTHORIZATION FAILED</text>

    <rect x="675" y="276" width="1150" height="410" rx="18" fill="#001b2b" stroke="#12455e" stroke-width="1.5"/>
    <text xml:space="preserve" font-family="SFMono-Regular, ui-monospace, Cascadia Mono, Consolas, monospace" font-size="32">
      <tspan x="716" y="338" fill="#6d92a8">$ az deployment group create ...</tspan>
      <tspan x="716" y="394" fill="#ff0005">ERROR: AuthorizationFailed (403)</tspan>
      <tspan x="716" y="505" fill="#6d92a8"># quick fix: hand-edit shared role</tspan>
      <tspan x="716" y="561" fill="#ffffff">resource assignment <tspan fill="#ff5c8a">'Microsoft.Authorization/</tspan></tspan>
      <tspan x="716" y="617"><tspan fill="#ff5c8a">  roleAssignments@2022-04-01'</tspan><tspan fill="#6d92a8"> // Bicep</tspan></tspan>
    </text>
    <line x1="716" y1="496" x2="1388" y2="496" stroke="#ff0005" stroke-width="2.5"/>

    <line x1="1897" y1="121" x2="1897" y2="841" stroke="#ff5c8a" stroke-width="2" stroke-dasharray="6 9"/>
    <text x="1954" y="481" text-anchor="middle" transform="rotate(90 1954 481)" font-family="SFMono-Regular, ui-monospace, Cascadia Mono, Consolas, monospace" font-size="25" letter-spacing="7.4" fill="#ff5c8a">DRIFT GATE</text>
  </g>

  <rect x="1" y="1" width="2046" height="892" rx="24" ry="24" fill="none" stroke="#12455e" stroke-width="2"/>
</svg>
