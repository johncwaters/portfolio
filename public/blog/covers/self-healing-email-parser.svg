<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 894" width="2048" height="894" font-family="SFMono-Regular, ui-monospace, Cascadia Mono, Consolas, monospace" role="img" aria-label="Cover graphic: a messy inbound locate-ticket email on the left, a gradient LLM RUNS ONCE chip in the center, and clean structured JSON output on the right">
  <defs>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="2048" height="894" rx="24"/>
    </clipPath>
    <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff0005"/>
      <stop offset="1" stop-color="#ff0092"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="2048" height="894" fill="#002438"/>

    <rect x="0" y="0" width="2048" height="104" fill="#032033"/>
    <line x1="0" y1="104" x2="2048" y2="104" stroke="#12455e" stroke-width="1"/>
    <circle cx="45" cy="52" r="11" fill="#ff0005"/>
    <circle cx="91.6" cy="52" r="11" fill="#ff0092"/>
    <circle cx="138.2" cy="52" r="11" fill="#12455e"/>
    <rect x="170" y="24" width="560" height="56" rx="28" fill="#001b2b" stroke="#12455e" stroke-width="1"/>
    <text x="199" y="61" font-size="27" fill="#6d92a8">blog/<tspan fill="#ff5c8a">self-healing-email-parser</tspan></text>

    <g font-size="32">
      <rect x="62" y="294" width="740" height="410" rx="18" fill="#001b2b" stroke="#12455e" stroke-width="1"/>
      <text x="99" y="357" fill="#6d92a8" xml:space="preserve">From: no-reply@tx811.org</text>
      <text x="99" y="413" fill="#6d92a8" xml:space="preserve">Subject: LOCATE REQUEST</text>
      <text x="99" y="469" fill="#ffffff" xml:space="preserve">TICKET NO: 2216984417</text>
      <text x="99" y="525" fill="#ffffff" xml:space="preserve">WORK DATE: 07/28/2026</text>
      <text x="99" y="581" fill="#6d92a8" xml:space="preserve">EXCAVATOR: ACME UTIL LLC</text>
      <text x="99" y="637" fill="#6d92a8" xml:space="preserve">-- format changed again --</text>
    </g>

    <g font-size="32" xml:space="preserve">
      <rect x="1246" y="322" width="740" height="354" rx="18" fill="#001b2b" stroke="#12455e" stroke-width="1"/>
      <text x="1283" y="385"><tspan fill="#ff5c8a">ticket:   </tspan><tspan fill="#ffffff"> "2216984417"</tspan></text>
      <text x="1283" y="441"><tspan fill="#ff5c8a">work_date:</tspan><tspan fill="#ffffff"> "2026-07-28"</tspan></text>
      <text x="1283" y="497"><tspan fill="#ff5c8a">excavator:</tspan><tspan fill="#ffffff"> "ACME UTIL"</tspan></text>
      <text x="1283" y="553"><tspan fill="#ff5c8a">parser:   </tspan><tspan fill="#ffffff"> deterministic</tspan></text>
      <text x="1283" y="609"><tspan fill="#ff5c8a">ai_on_hot_path:</tspan><tspan fill="#ff0005"> false</tspan></text>
    </g>

    <rect x="870" y="404" width="308" height="58" rx="29" fill="url(#grad)"/>
    <text x="1024" y="440" fill="#ffffff" font-size="28" letter-spacing="2" text-anchor="middle">LLM RUNS ONCE</text>
    <text x="1024" y="531" fill="#12455e" font-size="49" text-anchor="middle">&#8594;</text>
    <text x="1024" y="587" fill="#6d92a8" font-size="24" letter-spacing="2.5" text-anchor="middle">THEN: CODE ONLY</text>
  </g>

  <rect x="0.5" y="0.5" width="2047" height="893" rx="24" fill="none" stroke="#12455e" stroke-width="1"/>
</svg>
